<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <form id="form" action="#" method="get">
        <div class="form-section">
             <div class="form-content">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-content">
                <label for="author">Author</label>
                    <input type="text" id="author" name="author" value="">
            </div>
            <div class="form-content">
                <label for="pages">Number of pages</label>
                <input type="number" id="pages" name="pages" value="">
            </div>
            <div class="form-content">
                <label for="read">Read</label>
                <input type="radio" id="read" name="read" value="Read">
                <label for="read">Read</label>
                <input type="radio" id="still-reading" name="read" value="Still reading">
                <label for="still-reading">Still reading</label>
                <input type="radio" id="not-read" name="read" value="Not read">
                <label for="not-read">Not read</label>
            </div>
            <div class="add-book-button">
                <button type="submit" id="submit">Add book</button>
            </div>
            <div class="reset-form-button">
                <button type="reset">Reset</button>
            </div>
        </div>
    </form>
    <div class="library">
        
    </div>
    <dialog id="delete-modal" popover>
        <p>Are you sure you want to delete this book?</p>
        <button popovertarget="delete-modal" popovertargetaction="hide">Cancel</button>
        <button class="delete-btn" popovertarget="delete-modal" popovertargetaction="hide" uk-toggle="target: library.card">Delete</button>
    </dialog>
</body>
