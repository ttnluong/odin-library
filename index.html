<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-text">
                <h1>My Library</h1>
                <p>Your personal shelf, a collection of books</p>
            </div>
            <hr>
        </header>
        <main class="library">
        </main>
        <aside>
            <section class="stats-section">
                <div class="stats-wrapper">
                    <ol><!--  -->
                        <li><h4 id="stat-total"></h4><p>Books total</p></li>
                        <li><h4 id="stat-read"></h4><p>Read</p></li>
                        <li><h4 id="stat-still-reading"></h4><p>Still reading</p></li>
                        <li><h4 id="stat-not-read"></h4><p>Not read</p></li>
                    </ol>
                    <hr>
                </div>
            </section>
            <form id="form" action="#" method="get">
                <div class="form-wrapper">
                    <h2>Add new book</h2>
                    <hr>
                    <div class="form-content">
                        <label for="title">Title *</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-content">
                        <label for="author">Author</label>
                            <input type="text" id="author" name="author">
                    </div>
                    <div class="form-content">
                        <label for="pages">Number of pages</label>
                        <input type="number" id="pages" name="pages">
                    </div>
                    <div class="form-content">
                        <label for="read">Reading status</label>
                        <div class="radio-buttons-wrapper">
                            <div class="radio-button">
                                <input type="radio" id="read" name="read" value="Read">
                                <label for="read">Read</label>
                            </div>
                            <div class="radio-button">
                                <input type="radio" id="still-reading" name="read" value="Still reading">
                                <label for="still-reading">Still reading</label>
                            </div>
                            <div class="radio-button">
                                <input type="radio" id="not-read" name="read" value="Not read">
                                <label for="not-read">Not read</label>
                            </div>
                        </div>
                    </div>
                    <div class="add-book-button">
                        <button type="submit" id="submit">Add book</button>
                    </div>
                </div>
            </form>
        </aside>
    </div>
    <dialog class="modal" id="edit-modal" popover>
        <form id="edit-form">
            <div class="form-wrapper">
                <h2>Add new book</h2>
                <hr>
                <div class="form-content">
                    <label for="edit-title">Title *</label>
                    <input type="text" id="edit-title" name="title" required>
                </div>
                <div class="form-content">
                    <label for="edit-author">Author</label>
                        <input type="text" id="edit-author" name="author">
                </div>
                <div class="form-content">
                    <label for="edit-pages">Number of pages</label>
                    <input type="number" id="edit-pages" name="pages">
                </div>
                <div class="form-content">
                    <label for="edit-read">Reading status</label>
                    <div class="radio-buttons-wrapper">
                        <div class="radio-button">
                            <input type="radio" id="edit-read" name="edit-read" value="Read">
                            <label for="edit-read">Read</label>
                        </div>
                        <div class="radio-button">
                            <input type="radio" id="edit-still-reading" name="edit-read" value="Still reading">
                            <label for="edit-still-reading">Still reading</label>
                        </div>
                        <div class="radio-button">
                            <input type="radio" id="edit-not-read" name="edit-read" value="Not read">
                            <label for="edit-not-read">Not read</label>
                        </div>
                    </div>
                </div>
                <div class="add-book-button">
                    <button type="submit" id="submit">Edit book</button>
                </div>
            </div>
        </form>
    </dialog>
    <dialog class="modal" id="delete-modal" popover>
        <div class="delete-modal-content">
            <h2>Delete book</h2>
            <p>Are you sure you want to delete this book?</p>
            <button class="cancel-btn" popovertarget="delete-modal" popovertargetaction="hide">Cancel</button>
            <button class="delete-btn" popovertarget="delete-modal" popovertargetaction="hide" uk-toggle="target: library.card">Delete</button>
        </div>
    </dialog>
</body>
